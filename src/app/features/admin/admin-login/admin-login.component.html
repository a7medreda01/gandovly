<div class="admin-login-page flex-center" [class.platform-login]="platformLogin">
  <div class="login-card glass-panel text-center">
    <div class="login-brand-mark">@if (platformLogin) { <span>M</span> } @else if (settingsService.settings().logoUrl) { <img [src]="settingsService.settings().logoUrl" [alt]="settingsService.settings().restaurantName" /> } @else { <i class="bi bi-shop"></i> }</div>
    <h2>{{ platformLogin ? 'إدارة Mecart' : settingsService.settings().restaurantName }}</h2>
    <p>{{ platformLogin ? 'أهلاً بعودتك. سجل الدخول إلى مساحة إدارة متاجرك.' : 'سجل الدخول لإدارة طلبات متجرك ومنتجاته.' }}</p>

    <div class="form-box text-right">
      <div class="form-group">
        <label for="admUser">اسم المستخدم:</label>
        <input
          id="admUser"
          type="text"
          class="form-control"
          placeholder="أدخل اسم المستخدم"
          [(ngModel)]="username"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="admPass">كلمة المرور:</label>
        <div class="password-input-wrap">
          <input
            id="admPass"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            placeholder="أدخل كلمة المرور"
            [(ngModel)]="password"
            (keyup.enter)="login()"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-pass"
            (click)="toggleShowPassword()"
            [title]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
            tabindex="-1"
          >
            <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
          </button>
        </div>
      </div>

      <button class="btn-primary btn-block" (click)="login()" [disabled]="isLoading()">
        @if (isLoading()) { <span>جاري تسجيل الدخول... ⏳</span> } @else { <span>دخول للوحة التحكم 🔐</span> }
      </button>
    </div>
  </div>
</div>

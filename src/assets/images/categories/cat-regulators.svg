<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="regMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="regBrass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="regGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0e2a47" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#regGlow)">
    <!-- Brass In/Out Ports -->
    <rect x="14" y="66" width="22" height="14" rx="2" fill="url(#regBrass)" stroke="#92400e" stroke-width="1"/>
    <rect x="84" y="66" width="22" height="14" rx="2" fill="url(#regBrass)" stroke="#92400e" stroke-width="1"/>
    <rect x="10" y="64" width="6" height="18" rx="1.5" fill="#b45309"/>
    <rect x="104" y="64" width="6" height="18" rx="1.5" fill="#b45309"/>

    <!-- Lower Bell Housing -->
    <path d="M30 73 C30 88 90 88 90 73 Z" fill="url(#regMetal)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Central Flange Disc -->
    <ellipse cx="60" cy="72" rx="34" ry="10" fill="url(#regMetal)" stroke="#475569" stroke-width="1.5"/>

    <!-- Upper Dome Cap -->
    <path d="M36 71 C36 48 84 48 84 71 Z" fill="url(#regMetal)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="52" y="38" width="16" height="15" rx="3" fill="url(#regMetal)" stroke="#475569" stroke-width="1.2"/>
    <rect x="50" y="34" width="20" height="6" rx="2" fill="url(#regBrass)"/>

    <!-- Integrated Dial Pressure Gauge on Top -->
    <circle cx="60" cy="30" r="18" fill="#ffffff" stroke="#0e2a47" stroke-width="2.5"/>
    <circle cx="60" cy="30" r="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Gauge Ticks -->
    <path d="M50 30 L52 30 M70 30 L68 30 M60 20 L60 22 M53 23 L55 24 M67 23 L65 24" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Danger Red Arc -->
    <path d="M60 17 A13 13 0 0 1 73 30" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Gauge Needle -->
    <line x1="60" y1="30" x2="68" y2="24" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="30" r="3" fill="#0e2a47"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="valveBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="valveRedHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="valveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#713f12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#valveGlow)">
    <!-- Left & Right Hex Threaded Connections -->
    <rect x="14" y="58" width="22" height="26" rx="3" fill="url(#valveBrass)" stroke="#854d0e" stroke-width="1.2"/>
    <rect x="84" y="58" width="22" height="26" rx="3" fill="url(#valveBrass)" stroke="#854d0e" stroke-width="1.2"/>
    <line x1="22" y1="58" x2="22" y2="84" stroke="#713f12" stroke-width="1.2"/>
    <line x1="98" y1="58" x2="98" y2="84" stroke="#713f12" stroke-width="1.2"/>

    <!-- Central Valve Spherical Body -->
    <circle cx="60" cy="71" r="22" fill="url(#valveBrass)" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="60" cy="71" r="16" fill="url(#valveBrass)" opacity="0.7"/>

    <!-- Valve Stem Neck -->
    <rect x="53" y="40" width="14" height="18" rx="2" fill="url(#valveBrass)" stroke="#713f12" stroke-width="1"/>
    <rect x="50" y="36" width="20" height="7" rx="2" fill="url(#valveBrass)"/>

    <!-- Brass Stem Nut -->
    <polygon points="60,30 67,34 67,42 60,46 53,42 53,34" fill="#a16207" stroke="#713f12" stroke-width="1"/>

    <!-- Red Safety Quarter-Turn Lever Handle -->
    <path d="M56 36 L18 22 C14 20 16 14 22 15 L64 26 C66 27 68 29 68 32 L68 37 Z" fill="url(#valveRedHandle)" stroke="#7f1d1d" stroke-width="1.5"/>
    <!-- Handle Grip Hole -->
    <circle cx="26" cy="18" r="3.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00875a"/>
      <stop offset="100%" stop-color="#054b32"/>
    </linearGradient>
    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="safeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00875a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#safeGlow)">
    <!-- Safety Shield Background -->
    <path d="M60 14 C78 14 96 22 96 38 C96 68 60 98 60 98 C60 98 24 68 24 38 C24 22 42 14 60 14 Z" fill="url(#shieldBg)"/>
    <path d="M60 17 C76 17 92 24 92 39 C92 66 60 93 60 93 C60 93 28 66 28 39 C28 24 44 17 60 17 Z" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>

    <!-- Detector Device Plate Inside Shield -->
    <rect x="42" y="34" width="36" height="42" rx="8" fill="url(#deviceBody)" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Sensor Grill Slots -->
    <rect x="48" y="42" width="24" height="2.5" rx="1.2" fill="#64748b"/>
    <rect x="48" y="47" width="24" height="2.5" rx="1.2" fill="#64748b"/>
    <rect x="52" y="52" width="16" height="2.5" rx="1.2" fill="#64748b"/>

    <!-- LED Status Indicators -->
    <circle cx="50" cy="64" r="3" fill="#22c55e"/>
    <circle cx="50" cy="64" r="1.2" fill="#ffffff"/>
    <circle cx="60" cy="64" r="3" fill="#eab308"/>
    <circle cx="70" cy="64" r="3" fill="#ef4444"/>

    <!-- Alarm Broadcast Sound Waves on Top -->
    <path d="M48 24 C52 20 68 20 72 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M53 28 C55 26 65 26 67 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="60" cy="32" r="2" fill="#ffffff"/>
  </g>
</svg>
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Proxy /api/ requests to the backend for full backward compatibility
    location /api/ {
        client_max_body_size 150M;
        proxy_read_timeout 300s;
        proxy_pass https://api.mecart.app/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mecart.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /uploads/ requests (videos & tenant media) to backend for backward-compatible relative URLs
    location ^~ /uploads/ {
        proxy_pass https://api.mecart.app/uploads/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mecart.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Static assets cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Do not cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Vary "User-Agent" always;
    }

    # Forward social link-preview crawlers on store domains to backend SocialPreviewMiddleware
    location @social_preview {
        proxy_pass https://api.mecart.app;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mecart.app;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = /index.html;
    }

    # SPA Routing fallback
    location / {
        error_page 418 = @social_preview;
        set $social_bot "";
        if ($http_user_agent ~* "(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|LinkedInBot|Slackbot|Discordbot|SkypeUriPreview|Pinterestbot|vkShare|W3C_Validator)") {
            set $social_bot "B";
        }
        if ($host !~* "^(www\.)?mecart\.app$") {
            set $social_bot "${social_bot}S";
        }
        if ($social_bot = "BS") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }
}

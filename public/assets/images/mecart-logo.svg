<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="mecartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <rect x="4" y="6" width="48" height="48" rx="14" fill="url(#mecartGrad)" filter="url(#glow)"/>
  
  <!-- Cloud Arc Subtle Silhouette -->
  <path d="M14 36 C14 32, 18 30, 22 30 C24 25, 32 25, 35 29 C38 28, 42 31, 42 35 C42 37, 40 38, 38 38 L18 38 C15.5 38, 14 37, 14 36 Z" fill="rgba(255,255,255,0.18)" />

  <!-- Shopping Cart Icon -->
  <path d="M17 19 L21 19 L24.5 31 L37 31 L40 23 L23 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wheels -->
  <circle cx="26" cy="36" r="2.2" fill="#ffffff" />
  <circle cx="36" cy="36" r="2.2" fill="#ffffff" />
  <!-- Sparkle on cart -->
  <path d="M35 15 L36.2 18 L39 19.2 L36.2 20.4 L35 23.2 L33.8 20.4 L31 19.2 L33.8 18 Z" fill="#fef08a" />

  <!-- Logo Typography -->
  <text x="64" y="38" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    Me<tspan fill="#10b981">Cart</tspan>
  </text>
  <!-- Dot App TLD Pill -->
  <rect x="156" y="20" width="44" height="20" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="163" y="34" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">.app</text>

  <!-- Cloud SaaS Tagline -->
  <text x="65" y="49" font-family="'Cairo', system-ui, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1">CLOUD HOSTING PLATFORM</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="brassNut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="pipeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#9a3412" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#pipeGlow)">
    <!-- Intertwined Seamless Copper Pipe Coils -->
    <circle cx="60" cy="60" r="42" fill="none" stroke="url(#copper)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="url(#copper)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="18" fill="none" stroke="url(#copper)" stroke-width="7" stroke-linecap="round"/>

    <!-- High-Sheen Specular Highlights on the Copper Rings -->
    <path d="M35 35 A42 42 0 0 1 78 20" fill="none" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M42 42 A30 30 0 0 1 72 32" fill="none" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Brass Flare Nuts & Union Fittings Extending Out -->
    <!-- Top-Right Pipe End -->
    <path d="M78 22 L96 16" fill="none" stroke="url(#copper)" stroke-width="9" stroke-linecap="round"/>
    <rect x="92" y="10" width="14" height="12" rx="2" transform="rotate(-18 96 16)" fill="url(#brassNut)" stroke="#78350f" stroke-width="1"/>

    <!-- Bottom-Left Pipe End -->
    <path d="M42 98 L24 104" fill="none" stroke="url(#copper)" stroke-width="8" stroke-linecap="round"/>
    <rect x="14" y="98" width="14" height="12" rx="2" transform="rotate(-18 24 104)" fill="url(#brassNut)" stroke="#78350f" stroke-width="1"/>
  </g>
</svg>
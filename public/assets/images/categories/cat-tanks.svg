<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tankBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tankCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#126997"/>
      <stop offset="100%" stop-color="#0a3952"/>
    </linearGradient>
    <linearGradient id="brassValve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0e2a47" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Gas Tank Structure with Drop Shadow -->
  <g filter="url(#dropGlow)">
    <!-- Base Legs / Stand -->
    <path d="M42 98 L36 108 L45 108 L48 98 Z" fill="#64748b"/>
    <path d="M78 98 L84 108 L75 108 L72 98 Z" fill="#64748b"/>
    <rect x="38" y="106" width="44" height="4" rx="2" fill="#475569"/>

    <!-- Tank Cylinder Body -->
    <rect x="36" y="32" width="48" height="66" rx="24" fill="url(#tankBody)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Weld Seam Rings -->
    <path d="M36 46 Q60 50 84 46" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M36 84 Q60 88 84 84" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Top Shroud / Protective Collar -->
    <path d="M44 32 C44 20 76 20 76 32 Z" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M48 24 C48 19 72 19 72 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Brass Multi-Valve on Top -->
    <rect x="56" y="15" width="8" height="12" rx="1.5" fill="url(#brassValve)"/>
    <circle cx="60" cy="13" r="5" fill="#ef4444"/>
    <circle cx="60" cy="13" r="2" fill="#ffffff"/>

    <!-- Tank Central Emblem Badge -->
    <circle cx="60" cy="65" r="14" fill="#0e2a47"/>
    <circle cx="60" cy="65" r="12.5" fill="none" stroke="#f37021" stroke-width="1.2"/>
    <!-- Gas Flame Inside Badge -->
    <path d="M60 56 C57 60 54 62 54 66 C54 70 57 73 60 73 C63 73 66 70 66 66 C66 62 63 60 60 56 Z" fill="url(#flameGrad)"/>
    <path d="M60 62 C59 64 57 65 57 67 C57 69 58 70 60 70 C62 70 63 69 63 67 C63 65 61 64 60 62 Z" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>